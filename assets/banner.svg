<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 320" width="100%" height="100%">
  <defs>
    <!-- Dark Navy Background Gradients -->
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#04060A" />
      <stop offset="45%" stop-color="#070B14" />
      <stop offset="75%" stop-color="#0B1020" />
      <stop offset="100%" stop-color="#090D1A" />
    </linearGradient>

    <!-- Center Atmospheric Horizon Glow -->
    <radialGradient id="horizonGlow" cx="50%" cy="62%" r="55%">
      <stop offset="0%" stop-color="#00F0FF" stop-opacity="0.32" />
      <stop offset="25%" stop-color="#7B2FF7" stop-opacity="0.24" />
      <stop offset="60%" stop-color="#0B1020" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#070B14" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="upperVioletGlow" cx="50%" cy="15%" r="45%">
      <stop offset="0%" stop-color="#7B2FF7" stop-opacity="0.16" />
      <stop offset="100%" stop-color="#070B14" stop-opacity="0" />
    </radialGradient>

    <!-- Laser Horizon Line Gradients -->
    <linearGradient id="laserBeam" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F0FF" stop-opacity="0" />
      <stop offset="20%" stop-color="#00F0FF" stop-opacity="0.6" />
      <stop offset="45%" stop-color="#FCEE0A" stop-opacity="0.9" />
      <stop offset="55%" stop-color="#00F0FF" stop-opacity="0.9" />
      <stop offset="80%" stop-color="#7B2FF7" stop-opacity="0.7" />
      <stop offset="100%" stop-color="#7B2FF7" stop-opacity="0" />
    </linearGradient>

    <linearGradient id="movingStreakGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F0FF" stop-opacity="0" />
      <stop offset="40%" stop-color="#00F0FF" stop-opacity="0.9" />
      <stop offset="60%" stop-color="#FCEE0A" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#7B2FF7" stop-opacity="0" />
    </linearGradient>

    <!-- Perspective Grid Line Gradients -->
    <linearGradient id="gridVGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#00F0FF" stop-opacity="0.05" />
      <stop offset="30%" stop-color="#00F0FF" stop-opacity="0.18" />
      <stop offset="100%" stop-color="#00F0FF" stop-opacity="0.45" />
    </linearGradient>

    <linearGradient id="gridVioletGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#7B2FF7" stop-opacity="0.05" />
      <stop offset="40%" stop-color="#7B2FF7" stop-opacity="0.22" />
      <stop offset="100%" stop-color="#7B2FF7" stop-opacity="0.5" />
    </linearGradient>

    <!-- Skyline Structure Gradients -->
    <linearGradient id="towerGradFar" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#070B14" />
    </linearGradient>

    <linearGradient id="towerGradMid" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0D1527" />
      <stop offset="100%" stop-color="#050912" />
    </linearGradient>

    <linearGradient id="towerGradNear" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0A111F" />
      <stop offset="100%" stop-color="#04060C" />
    </linearGradient>

    <!-- Scanline Texture -->
    <pattern id="subtleScanlines" width="100" height="4" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="100" y2="0" stroke="#000000" stroke-width="1.2" opacity="0.26" />
    </pattern>

    <!-- Glow Filter -->
    <filter id="neonBlur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="wideHaze" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <style>
      <![CDATA[
      @keyframes pulse-horizon {
        0%, 100% { opacity: 0.75; transform: scaleY(1); }
        50% { opacity: 1; transform: scaleY(1.15); }
      }

      @keyframes light-streak-run {
        0% { transform: translateX(-1280px); }
        100% { transform: translateX(1280px); }
      }

      @keyframes particle-drift-1 {
        0%, 100% { transform: translateY(0px) translateX(0px); opacity: 0.35; }
        50% { transform: translateY(-7px) translateX(5px); opacity: 0.85; }
      }

      @keyframes particle-drift-2 {
        0%, 100% { transform: translateY(0px) translateX(0px); opacity: 0.5; }
        50% { transform: translateY(-10px) translateX(-6px); opacity: 0.95; }
      }

      @keyframes beacon-blink {
        0%, 100% { opacity: 0.25; }
        45%, 55% { opacity: 1; }
      }

      .pulse-layer {
        animation: pulse-horizon 5s ease-in-out infinite;
        transform-origin: 640px 198px;
      }

      .streak-anim {
        animation: light-streak-run 7s linear infinite;
      }

      .particle-group-1 {
        animation: particle-drift-1 6s ease-in-out infinite;
      }

      .particle-group-2 {
        animation: particle-drift-2 8s ease-in-out infinite;
      }

      .beacon-1 {
        animation: beacon-blink 2.2s infinite ease-in-out;
      }

      .beacon-2 {
        animation: beacon-blink 3.1s infinite ease-in-out;
      }

      @media (prefers-reduced-motion: reduce) {
        .pulse-layer,
        .streak-anim,
        .particle-group-1,
        .particle-group-2,
        .beacon-1,
        .beacon-2 {
          animation: none !important;
          opacity: 1 !important;
          transform: none !important;
        }
      }
      ]]>
    </style>
  </defs>

  <!-- SOLID NAVY BACKGROUND -->
  <rect width="1280" height="320" fill="url(#skyGrad)" />

  <!-- Upper Atmosphere Violet Nebula -->
  <rect width="1280" height="320" fill="url(#upperVioletGlow)" />

  <!-- ================= SILHOUETTE CYBERPUNK SKYLINE ================= -->
  <!-- Layer 1: Distant Abstract Towers (Deep Silhouette) -->
  <g opacity="0.6">
    <!-- Far Left Clusters -->
    <polygon points="60,200 60,110 75,95 100,95 115,110 115,200" fill="url(#towerGradFar)" stroke="#7B2FF7" stroke-width="0.5" stroke-opacity="0.3" />
    <polygon points="125,200 125,130 140,115 170,115 170,200" fill="url(#towerGradFar)" stroke="#00F0FF" stroke-width="0.5" stroke-opacity="0.25" />
    <line x1="88" y1="95" x2="88" y2="70" stroke="#00F0FF" stroke-width="1" stroke-opacity="0.6" />
    <circle cx="88" cy="68" r="1.5" fill="#00F0FF" class="beacon-1" />

    <!-- Left Flank Angular Towers -->
    <polygon points="190,200 190,140 210,120 235,120 250,135 250,200" fill="url(#towerGradFar)" />
    <polygon points="270,200 270,105 290,85 315,85 330,100 330,200" fill="url(#towerGradFar)" stroke="#7B2FF7" stroke-width="0.5" stroke-opacity="0.3" />
    <line x1="302" y1="85" x2="302" y2="60" stroke="#FCEE0A" stroke-width="1" stroke-opacity="0.7" />
    <circle cx="302" cy="58" r="1.5" fill="#FCEE0A" class="beacon-2" />

    <!-- Center Left Stepped Building (Open Center Composition) -->
    <polygon points="360,200 360,155 385,130 420,130 435,145 435,200" fill="url(#towerGradFar)" stroke="#00F0FF" stroke-width="0.5" stroke-opacity="0.2" />

    <!-- Center Right Stepped Building -->
    <polygon points="845,200 845,145 860,130 895,130 920,155 920,200" fill="url(#towerGradFar)" stroke="#7B2FF7" stroke-width="0.5" stroke-opacity="0.2" />

    <!-- Right Flank Angular Towers -->
    <polygon points="950,200 950,100 965,85 990,85 1010,105 1010,200" fill="url(#towerGradFar)" stroke="#00F0FF" stroke-width="0.5" stroke-opacity="0.3" />
    <line x1="978" y1="85" x2="978" y2="62" stroke="#00F0FF" stroke-width="1" stroke-opacity="0.7" />
    <circle cx="978" cy="60" r="1.5" fill="#00F0FF" class="beacon-1" />

    <!-- Far Right Clusters -->
    <polygon points="1030,200 1030,135 1045,120 1070,120 1090,140 1090,200" fill="url(#towerGradFar)" />
    <polygon points="1110,200 1110,110 1125,95 1155,95 1170,110 1170,200" fill="url(#towerGradFar)" stroke="#7B2FF7" stroke-width="0.5" stroke-opacity="0.3" />
    <line x1="1140" y1="95" x2="1140" y2="72" stroke="#FCEE0A" stroke-width="1" stroke-opacity="0.7" />
    <circle cx="1140" cy="70" r="1.5" fill="#FCEE0A" class="beacon-2" />
    <polygon points="1185,200 1185,130 1205,110 1235,110 1235,200" fill="url(#towerGradFar)" />
  </g>

  <!-- Layer 2: Mid-Ground Angular Mega-structures with Neon Edge Strips & Lit Windows -->
  <g>
    <!-- Left Mid Structure 1 -->
    <polygon points="80,200 80,125 100,105 150,105 165,120 165,200" fill="url(#towerGradMid)" stroke="#00F0FF" stroke-width="1" stroke-opacity="0.4" />
    <!-- Vertical Neon Energy Conduit Strip -->
    <line x1="122" y1="105" x2="122" y2="198" stroke="#00F0FF" stroke-width="1.2" stroke-opacity="0.55" />
    <!-- Lit Windows (Yellow & Cyan Dots) -->
    <rect x="94" y="130" width="3" height="3" fill="#FCEE0A" opacity="0.85" />
    <rect x="104" y="130" width="3" height="3" fill="#00F0FF" opacity="0.7" />
    <rect x="94" y="145" width="3" height="3" fill="#00F0FF" opacity="0.8" />
    <rect x="140" y="155" width="3" height="3" fill="#FCEE0A" opacity="0.9" />
    <rect x="140" y="170" width="3" height="3" fill="#00F0FF" opacity="0.75" />

    <!-- Left Mid Structure 2 (Chamfered Top Tower) -->
    <polygon points="215,200 215,115 240,90 280,90 305,115 305,200" fill="url(#towerGradMid)" stroke="#7B2FF7" stroke-width="1" stroke-opacity="0.45" />
    <line x1="260" y1="90" x2="260" y2="198" stroke="#7B2FF7" stroke-width="1.2" stroke-opacity="0.6" />
    <rect x="235" y="125" width="3" height="3" fill="#00F0FF" opacity="0.85" />
    <rect x="245" y="125" width="3" height="3" fill="#FCEE0A" opacity="0.9" />
    <rect x="275" y="140" width="3" height="3" fill="#00F0FF" opacity="0.75" />
    <rect x="235" y="160" width="3" height="3" fill="#FCEE0A" opacity="0.8" />
    <line x1="260" y1="90" x2="260" y2="65" stroke="#00F0FF" stroke-width="1.2" stroke-opacity="0.8" />
    <circle cx="260" cy="63" r="2" fill="#00F0FF" class="beacon-1" />

    <!-- Right Mid Structure 1 (Chamfered Top Tower) -->
    <polygon points="975,200 975,115 1000,90 1040,90 1065,115 1065,200" fill="url(#towerGradMid)" stroke="#00F0FF" stroke-width="1" stroke-opacity="0.45" />
    <line x1="1020" y1="90" x2="1020" y2="198" stroke="#00F0FF" stroke-width="1.2" stroke-opacity="0.6" />
    <rect x="995" y="125" width="3" height="3" fill="#FCEE0A" opacity="0.9" />
    <rect x="1035" y="125" width="3" height="3" fill="#00F0FF" opacity="0.8" />
    <rect x="995" y="150" width="3" height="3" fill="#00F0FF" opacity="0.75" />
    <rect x="1035" y="165" width="3" height="3" fill="#FCEE0A" opacity="0.85" />
    <line x1="1020" y1="90" x2="1020" y2="65" stroke="#FCEE0A" stroke-width="1.2" stroke-opacity="0.8" />
    <circle cx="1020" cy="63" r="2" fill="#FCEE0A" class="beacon-2" />

    <!-- Right Mid Structure 2 -->
    <polygon points="1115,200 1115,125 1130,110 1180,110 1200,130 1200,200" fill="url(#towerGradMid)" stroke="#7B2FF7" stroke-width="1" stroke-opacity="0.4" />
    <line x1="1155" y1="110" x2="1155" y2="198" stroke="#7B2FF7" stroke-width="1.2" stroke-opacity="0.55" />
    <rect x="1135" y="135" width="3" height="3" fill="#00F0FF" opacity="0.8" />
    <rect x="1170" y="145" width="3" height="3" fill="#FCEE0A" opacity="0.85" />
    <rect x="1135" y="165" width="3" height="3" fill="#00F0FF" opacity="0.75" />
  </g>

  <!-- Layer 3: Foreground Angular Monoliths (Lower Flanks, Leaving Centre Wide Open) -->
  <g>
    <!-- Left Foreground Edge Monolith -->
    <polygon points="20,200 20,150 40,130 70,130 90,150 90,200" fill="url(#towerGradNear)" stroke="#00F0FF" stroke-width="1" stroke-opacity="0.6" />
    <line x1="40" y1="130" x2="40" y2="198" stroke="#00F0FF" stroke-width="1.5" stroke-opacity="0.8" filter="url(#neonBlur)" />

    <!-- Right Foreground Edge Monolith -->
    <polygon points="1190,200 1190,150 1210,130 1240,130 1260,150 1260,200" fill="url(#towerGradNear)" stroke="#7B2FF7" stroke-width="1" stroke-opacity="0.6" />
    <line x1="1240" y1="130" x2="1240" y2="198" stroke="#7B2FF7" stroke-width="1.5" stroke-opacity="0.8" filter="url(#neonBlur)" />
  </g>

  <!-- ================= FLOATING DRIFTING CYBER PARTICLES ================= -->
  <g class="particle-group-1">
    <circle cx="210" cy="75" r="1.5" fill="#00F0FF" filter="url(#neonBlur)" />
    <circle cx="340" cy="115" r="1.2" fill="#FCEE0A" />
    <circle cx="490" cy="85" r="1.8" fill="#00F0FF" filter="url(#neonBlur)" />
    <circle cx="610" cy="65" r="1.5" fill="#7B2FF7" />
    <circle cx="780" cy="95" r="1.4" fill="#FCEE0A" />
    <circle cx="910" cy="70" r="1.6" fill="#00F0FF" filter="url(#neonBlur)" />
    <circle cx="1080" cy="110" r="1.2" fill="#7B2FF7" />
  </g>

  <g class="particle-group-2">
    <circle cx="160" cy="130" r="1.2" fill="#7B2FF7" />
    <circle cx="290" cy="60" r="1.6" fill="#00F0FF" />
    <circle cx="430" cy="140" r="1.4" fill="#FCEE0A" />
    <circle cx="560" cy="110" r="2.0" fill="#00F0FF" filter="url(#neonBlur)" />
    <circle cx="680" cy="75" r="1.5" fill="#FCEE0A" />
    <circle cx="740" cy="135" r="1.8" fill="#00F0FF" filter="url(#neonBlur)" />
    <circle cx="860" cy="120" r="1.3" fill="#7B2FF7" />
    <circle cx="1140" cy="80" r="1.5" fill="#00F0FF" />
  </g>

  <!-- ================= HORIZON GLOW & LIGHT ENERGY ================= -->
  <!-- Wide Radiant Horizon Haze in the Open Centre -->
  <rect x="0" y="80" width="1280" height="240" fill="url(#horizonGlow)" class="pulse-layer" />

  <!-- Laser Horizon Dividing Line with Glowing Center Accent -->
  <line x1="30" y1="198" x2="1250" y2="198" stroke="url(#laserBeam)" stroke-width="2.2" filter="url(#neonBlur)" />

  <!-- Center Diamond Horizon Pivot -->
  <polygon points="640,192 646,198 640,204 634,198" fill="#FCEE0A" filter="url(#neonBlur)" />
  <circle cx="640" cy="198" r="1.5" fill="#FFFFFF" />

  <!-- Animated High-Speed Moving Light Streak Along Horizon -->
  <g class="streak-anim" opacity="0.8">
    <rect x="0" y="196" width="340" height="3" rx="1.5" fill="url(#movingStreakGrad)" filter="url(#neonBlur)" />
  </g>

  <!-- ================= 3D PERSPECTIVE NEON GRID FLOOR ================= -->
  <g>
    <!-- Horizontal Perspective Lines (Increasing Frequency & Progressive Width Toward Viewer) -->
    <line x1="0" y1="205" x2="1280" y2="205" stroke="url(#gridVGrad)" stroke-width="0.8" />
    <line x1="0" y1="214" x2="1280" y2="214" stroke="url(#gridVGrad)" stroke-width="0.9" />
    <line x1="0" y1="225" x2="1280" y2="225" stroke="url(#gridVGrad)" stroke-width="1.0" />
    <line x1="0" y1="239" x2="1280" y2="239" stroke="url(#gridVGrad)" stroke-width="1.2" />
    <line x1="0" y1="256" x2="1280" y2="256" stroke="url(#gridVGrad)" stroke-width="1.4" />
    <line x1="0" y1="278" x2="1280" y2="278" stroke="url(#gridVioletGrad)" stroke-width="1.6" />
    <line x1="0" y1="305" x2="1280" y2="305" stroke="url(#gridVioletGrad)" stroke-width="2.0" />

    <!-- Perspective Rays Receding to Horizon Center Vanishing Point (640, 198) -->
    <line x1="640" y1="198" x2="640" y2="320" stroke="url(#gridVioletGrad)" stroke-width="1.6" filter="url(#neonBlur)" />
    <line x1="640" y1="198" x2="540" y2="320" stroke="url(#gridVGrad)" stroke-width="1.3" />
    <line x1="640" y1="198" x2="740" y2="320" stroke="url(#gridVGrad)" stroke-width="1.3" />
    <line x1="640" y1="198" x2="420" y2="320" stroke="url(#gridVGrad)" stroke-width="1.3" />
    <line x1="640" y1="198" x2="860" y2="320" stroke="url(#gridVGrad)" stroke-width="1.3" />
    <line x1="640" y1="198" x2="280" y2="320" stroke="url(#gridVioletGrad)" stroke-width="1.4" />
    <line x1="640" y1="198" x2="1000" y2="320" stroke="url(#gridVioletGrad)" stroke-width="1.4" />
    <line x1="640" y1="198" x2="120" y2="320" stroke="url(#gridVGrad)" stroke-width="1.5" />
    <line x1="640" y1="198" x2="1160" y2="320" stroke="url(#gridVGrad)" stroke-width="1.5" />
    <line x1="640" y1="198" x2="-60" y2="320" stroke="url(#gridVGrad)" stroke-width="1.5" />
    <line x1="640" y1="198" x2="1340" y2="320" stroke="url(#gridVGrad)" stroke-width="1.5" />
    <line x1="640" y1="198" x2="-260" y2="320" stroke="url(#gridVioletGrad)" stroke-width="1.5" />
    <line x1="640" y1="198" x2="1540" y2="320" stroke="url(#gridVioletGrad)" stroke-width="1.5" />
  </g>

  <!-- Center Floor Ambient Focus Pool -->
  <ellipse cx="640" cy="245" rx="220" ry="25" fill="#00F0FF" fill-opacity="0.12" filter="url(#wideHaze)" />

  <!-- ================= ANGULAR CUT-CORNER CYBER FRAME & CIRCUIT TRACES ================= -->
  <!-- Outer Chamfered Neon Border (Sharp Cut Corners) -->
  <polygon points="
    28,12 1252,12 1268,28 1268,292 1252,308 28,308 12,292 12,28
  " fill="none" stroke="#7B2FF7" stroke-width="1.6" stroke-opacity="0.45" />

  <!-- Inner High-Tech Chamfered Offset Stroke -->
  <polygon points="
    34,18 1246,18 1262,34 1262,286 1246,302 34,302 18,286 18,34
  " fill="none" stroke="#00F0FF" stroke-width="0.8" stroke-opacity="0.3" />

  <!-- Top-Left Corner Geometric Circuit Accent -->
  <path d="M 12,65 L 12,28 L 28,12 L 80,12 L 95,27 L 160,27" fill="none" stroke="#00F0FF" stroke-width="2" />
  <circle cx="160" cy="27" r="2.5" fill="#FCEE0A" />
  <rect x="50" y="10" width="12" height="4" fill="#7B2FF7" />

  <!-- Top-Right Corner Geometric Circuit Accent -->
  <path d="M 1268,65 L 1268,28 L 1252,12 L 1200,12 L 1185,27 L 1120,27" fill="none" stroke="#7B2FF7" stroke-width="2" />
  <circle cx="1120" cy="27" r="2.5" fill="#00F0FF" />
  <rect x="1218" y="10" width="12" height="4" fill="#FCEE0A" />

  <!-- Bottom-Left Corner Geometric Circuit Accent -->
  <path d="M 12,255 L 12,292 L 28,308 L 80,308 L 95,293 L 140,293" fill="none" stroke="#7B2FF7" stroke-width="2" />
  <circle cx="140" cy="293" r="2.5" fill="#00F0FF" />
  <rect x="22" y="278" width="3" height="14" fill="#FCEE0A" />

  <!-- Bottom-Right Corner Geometric Circuit Accent -->
  <path d="M 1268,255 L 1268,292 L 1252,308 L 1200,308 L 1185,293 L 1140,293" fill="none" stroke="#00F0FF" stroke-width="2" />
  <circle cx="1140" cy="293" r="2.5" fill="#FCEE0A" />
  <rect x="1255" y="278" width="3" height="14" fill="#00F0FF" />

  <!-- Subtle Midpoint Edge Ticks (Pure Geometry) -->
  <polygon points="636,12 640,8 644,12" fill="#00F0FF" opacity="0.75" />
  <polygon points="636,308 640,312 644,308" fill="#7B2FF7" opacity="0.75" />
  <polygon points="12,160 8,164 12,168" fill="#FCEE0A" opacity="0.75" />
  <polygon points="1268,160 1272,164 1268,168" fill="#00F0FF" opacity="0.75" />

  <!-- SUBTLE OVERLAY SCANLINES -->
  <rect width="1280" height="320" fill="url(#subtleScanlines)" pointer-events="none" />
</svg>
