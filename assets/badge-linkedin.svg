<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 150 36" width="150" height="36">
  <defs>
    <linearGradient id="bgGradIn" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070B14" />
      <stop offset="100%" stop-color="#0B1020" />
    </linearGradient>
  </defs>

  <!-- Solid Dark Navy Base with Cut Corner Cyberpunk Frame -->
  <polygon points="6,1 144,1 149,6 149,30 144,35 6,35 1,30 1,6"
           fill="url(#bgGradIn)"
           stroke="#7B2FF7"
           stroke-width="1.5" />

  <!-- Left Accent Notch -->
  <line x1="1" y1="12" x2="1" y2="24" stroke="#00F0FF" stroke-width="2" />

  <!-- LinkedIn Official Icon -->
  <g transform="translate(14, 10)">
    <rect width="16" height="16" rx="2" fill="#7B2FF7" />
    <!-- 'in' glyph in crisp white -->
    <circle cx="4.5" cy="4.5" r="1.2" fill="#FFFFFF" />
    <rect x="3.4" y="6.8" width="2.2" height="6.2" fill="#FFFFFF" />
    <path d="M 7.8,6.8 L 9.8,6.8 L 9.8,7.8 C 10.2,7.1 11.0,6.6 12.0,6.6 C 13.6,6.6 14.4,7.6 14.4,9.6 L 14.4,13.0 L 12.2,13.0 L 12.2,9.9 C 12.2,9.0 11.8,8.4 11.0,8.4 C 10.1,8.4 9.8,9.0 9.8,9.9 L 9.8,13.0 L 7.8,13.0 Z" fill="#FFFFFF" />
  </g>

  <!-- Monospace Label -->
  <text x="39" y="22.5"
        font-family="'Fira Code', 'JetBrains Mono', ui-monospace, SFMono-Regular, monospace"
        font-size="12"
        font-weight="700"
        letter-spacing="1.5px"
        fill="#FFFFFF">
    LINKEDIN
  </text>

  <!-- External Arrow Accent -->
  <g transform="translate(130, 12)">
    <path d="M 0,9 L 7,2 M 2,2 L 7,2 L 7,7" fill="none" stroke="#7B2FF7" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" />
  </g>
</svg>
