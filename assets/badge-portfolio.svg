<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 156 36" width="156" height="36">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070B14" />
      <stop offset="100%" stop-color="#0B1020" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Solid Dark Navy Base with Cut Corner Cyberpunk Frame -->
  <polygon points="6,1 150,1 155,6 155,30 150,35 6,35 1,30 1,6"
           fill="url(#bgGrad)"
           stroke="#00F0FF"
           stroke-width="1.5" />

  <!-- Left Accent Notch -->
  <line x1="1" y1="12" x2="1" y2="24" stroke="#FCEE0A" stroke-width="2" />

  <!-- Terminal / Globe Icon -->
  <g transform="translate(14, 10)">
    <!-- Terminal Screen / Globe Outline -->
    <rect x="0" y="0" width="16" height="15" rx="2" fill="none" stroke="#00F0FF" stroke-width="1.3" />
    <path d="M 4,4.5 L 7.5,7.5 L 4,10.5" fill="none" stroke="#FCEE0A" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" />
    <line x1="9" y1="11" x2="12.5" y2="11" stroke="#00F0FF" stroke-width="1.4" stroke-linecap="round" />
  </g>

  <!-- Monospace Label -->
  <text x="40" y="22.5"
        font-family="'Fira Code', 'JetBrains Mono', ui-monospace, SFMono-Regular, monospace"
        font-size="12"
        font-weight="700"
        letter-spacing="1.5px"
        fill="#FFFFFF">
    PORTFOLIO
  </text>

  <!-- External Arrow Accent -->
  <g transform="translate(136, 12)">
    <path d="M 0,9 L 7,2 M 2,2 L 7,2 L 7,7" fill="none" stroke="#00F0FF" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" />
  </g>
</svg>
