<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 130 36" width="130" height="36">
  <defs>
    <linearGradient id="bgGradMail" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070B14" />
      <stop offset="100%" stop-color="#0B1020" />
    </linearGradient>
  </defs>

  <!-- Solid Dark Navy Base with Cut Corner Cyberpunk Frame -->
  <polygon points="6,1 124,1 129,6 129,30 124,35 6,35 1,30 1,6"
           fill="url(#bgGradMail)"
           stroke="#FCEE0A"
           stroke-width="1.5" />

  <!-- Left Accent Notch -->
  <line x1="1" y1="12" x2="1" y2="24" stroke="#7B2FF7" stroke-width="2" />

  <!-- Mail Envelope Icon -->
  <g transform="translate(14, 11)">
    <rect x="0" y="0" width="16" height="14" rx="2" fill="none" stroke="#FCEE0A" stroke-width="1.3" />
    <path d="M 1,2 L 8,8 L 15,2" fill="none" stroke="#FCEE0A" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <!-- Monospace Label -->
  <text x="39" y="22.5"
        font-family="'Fira Code', 'JetBrains Mono', ui-monospace, SFMono-Regular, monospace"
        font-size="12"
        font-weight="700"
        letter-spacing="1.5px"
        fill="#FFFFFF">
    EMAIL
  </text>

  <!-- External Arrow Accent -->
  <g transform="translate(112, 12)">
    <path d="M 0,9 L 7,2 M 2,2 L 7,2 L 7,7" fill="none" stroke="#FCEE0A" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" />
  </g>
</svg>
